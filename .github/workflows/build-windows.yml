name: build-windows

# Windows x64 release build (NSIS Setup + Portable + SHA256 checksums).
# Trigger: push a version tag — bump package.json, commit, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows x64 (NSIS Setup + Portable)
        run: npm run dist:win

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum LATCHI-SOCIAL-HUB-*.exe | tee SHA256SUMS.txt

      - name: Create GitHub Release and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/LATCHI-SOCIAL-HUB-Setup-*.exe \
            dist/LATCHI-SOCIAL-HUB-Portable-*.exe \
            dist/SHA256SUMS.txt \
            --title "LATCHI SOCIAL HUB ${{ github.ref_name }}" \
            --notes "Windows 10/11 x64 — ${{ github.ref_name }}

          📦 Files / الملفات:
          - LATCHI-SOCIAL-HUB-Setup-*.exe — Installer / المثبّت (custom install path, Start-menu + desktop shortcuts, clean uninstall that keeps user data)
          - LATCHI-SOCIAL-HUB-Portable-*.exe — Portable / النسخة المحمولة (single file, no install)
          - SHA256SUMS.txt — Integrity checksums / بصمات التحقق

          ✨ Highlights / أبرز الميزات:
          - 8 platforms / ثماني منصات: Instagram · Facebook · Messenger · WhatsApp · Gmail · Outlook · YouTube · Telegram
          - One Meta login / دخول واحد لمنصات Meta (Facebook + Instagram + Messenger)
          - Encrypted backup & restore (AES-256-GCM) / نسخ احتياطي مشفّر واستعادة
          - Luxury AI visual identity: app icon, 8 platform tiles, home banner, 10 backgrounds / هوية بصرية فاخرة بالذكاء الاصطناعي
          - Random background slideshow every 3s / سلايد شو عشوائي للخلفيات
          - Full AR/EN with RTL/LTR / عربي-إنجليزي كامل

          ⚠️ Note: the build is unsigned — SmartScreen may show an Unknown-publisher warning on first run: More info → Run anyway.
          تنبيه: البناء غير موقّع — قد يُظهر SmartScreen تحذيراً عند أول تشغيل: More info ثم Run anyway."
